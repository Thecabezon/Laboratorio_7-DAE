{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}Blog Django{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    <header>
        <h1><a href="{% url 'blog:post_list' %}">Mi Blog Django</a></h1>
        <nav>
            <a href="{% url 'blog:post_list' %}">Inicio</a>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- Contenido principal -->
        {% endblock %}
    </main>

    <footer>
        <p>© 2025 Mi Blog Django</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
