{% extends "blog/base.html" %}

{% block title %}Listado de Posts{% endblock %}

{% block content %}
<h2>Posts publicados</h2>
<ul>
    {% for post in posts %}
    <li>
        <a href="{% url 'blog:post_detail' post.slug %}">{{ post.title }}</a> - {{ post.created_at|date:"d M Y" }}
    </li>
    {% empty %}
    <li>No hay posts disponibles.</li>
    {% endfor %}
</ul>
{% endblock %}
