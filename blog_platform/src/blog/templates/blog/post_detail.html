{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article>
    <h2>{{ post.title }}</h2>
    <p><small>Publicado el {{ post.created_at|date:"d M Y" }}</small></p>
    <div>{{ post.content|linebreaks }}</div>
</article>
<a href="{% url 'blog:post_list' %}">Volver al listado</a>
{% endblock %}
